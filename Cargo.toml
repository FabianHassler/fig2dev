[workspace]
resolver = "2"
members = ["crates/figbase", "crates/fig2dev", "apps/fig2dev", "xtask"]
default-members = ["apps/fig2dev"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fahasch/fig2dev"
rust-version = "1.89"

[workspace.dependencies]
figbase = { path = "crates/figbase" }
fig2dev = { path = "crates/fig2dev" }
serde = { version = "1", features = ["derive", "rc"] }
tiny-skia = "0.11"
ttf-parser = "0.25"
epaint_default_fonts = "0.33"
pdf-writer = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "pnm", "tiff"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
field_reassign_with_default = "allow"

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
