[package]
name = "figbase"
description = "What the fig2dev port shares with RustFig: Fig geometry, font tables and metrics, colours"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["fig", "xfig", "fig2dev", "geometry", "fonts"]
categories = ["graphics", "rendering::data-formats"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
ttf-parser.workspace = true
epaint_default_fonts.workspace = true
fontdb.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { workspace = true, features = ["fs", "memmap"] }
