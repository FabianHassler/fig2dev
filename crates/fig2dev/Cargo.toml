[package]
name = "fig2dev"
description = "fig2dev's object model, reader and output drivers, a Rust port of fig2dev 3.2.9a"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
figbase.workspace = true
image.workspace = true
tiny-skia.workspace = true
pdf-writer.workspace = true
miniz_oxide = "0.8"
encoding_rs = "0.8"
png = { version = "0.18", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }
